# APK di prova scaricabile: a ogni tag `v*` compila l'app (Rust con cargo-ndk + Gradle) e la
# allega a una Release di GitHub. È la build debug, firmata con una chiave di debug generata
# qui: per una build firmata con la chiave del progetto servono i segreti del keystore.
name: APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: sdkmanager --install "ndk;29.0.14206865"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compila l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Pubblica nella Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="rondine-${GITHUB_REF_NAME}-prova.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --prerelease \
            --title "Rondine ${GITHUB_REF_NAME} (prova)" \
            --notes "APK di prova (build debug), da installare a mano su Android 8 o successivo. Si installa accanto a un'eventuale versione definitiva (io.github.mtmattia.rondine.debug). Ogni APK di prova ha una firma diversa: per aggiornarlo va disinstallato il precedente, e con lui il profilo."

      - name: APK come artefatto
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: rondine-prova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
