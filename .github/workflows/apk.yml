# App Android (Rust con cargo-ndk + Gradle).
# - Tag `v*`: versione vera, firmata con la chiave unica del progetto (segreti
#   RONDINE_FIRMA_KEYSTORE_B64 e RONDINE_FIRMA_PASSWORD): APK foss nella Release di GitHub (lo
#   stesso, byte per byte, che compila F-Droid) e AAB play per Google Play. Stessa firma: le
#   versioni si aggiornano a vicenda (docs/PUBBLICAZIONE.md).
# - Branch di lavoro `ccr-*`: APK di prova (debug, chiave di debug di ogni build) in una
#   pre-release.
name: APK

on:
  push:
    tags: ["v*"]
    branches: ["ccr-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # L'SDK Android è già sul runner (ANDROID_HOME): si aggiungono licenze e NDK.
      - name: SDK e NDK
        run: |
          sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "ndk;29.0.14206865"

      # La versione di Rust è quella di rust-toolchain.toml (rustup la installa da sé).
      - name: Rust
        run: rustup show active-toolchain

      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Versione firmata
        if: github.ref_type == 'tag'
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.RONDINE_FIRMA_KEYSTORE_B64 }}
          RONDINE_FIRMA_PASSWORD: ${{ secrets.RONDINE_FIRMA_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$RONDINE_FIRMA_PASSWORD" ]; then
            echo "Mancano i segreti della chiave di firma: vedi docs/PUBBLICAZIONE.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rondine.jks"
          export RONDINE_FIRMA_KEYSTORE="$RUNNER_TEMP/rondine.jks"
          tag="$GITHUB_REF_NAME"
          # Gli APK di GitHub solo per i telefoni (arm64): x86_64 serve a emulatori e Chromebook,
          # che usano l'AAB di Google Play. Così l'APK pesa la metà.
          ./gradlew --no-daemon -Prondine.abis=arm64-v8a assembleFossRelease assemblePlayRelease
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "../rondine-${tag}.apk"
          cp app/build/outputs/apk/play/release/app-play-release.apk "../rondine-${tag}-play.apk"
          # L'AAB per Google Play a parte (arm64 e x86_64, Play dà a ognuno il suo): senza
          # aggiornamenti da GitHub, che Play vieta.
          ./gradlew --no-daemon -Prondine.negozio=true bundlePlayRelease
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "../rondine-${tag}-play.aab"
          rm "$RUNNER_TEMP/rondine.jks"
          # Le versioni 0.x sono anteprime.
          pre=""; case "$tag" in v0.*) pre="--prerelease";; esac
          # Prima le novità (le mostra anche l'app quando propone l'aggiornamento), poi il resto.
          code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          notes="$RUNNER_TEMP/note.md"
          news="../fastlane/metadata/android/it-IT/changelogs/${code}.txt"
          if [ -f "$news" ]; then cat "$news"; echo; fi > "$notes"
          echo "Rondine ${tag}. Due versioni, stessa firma: si installano una sopra l'altra senza perdere niente. rondine-${tag}.apk è la versione libera (come su F-Droid): notifiche con ntfy. rondine-${tag}-play.apk è la versione Google: se manca ntfy, notifiche attraverso Google (FCM). L'AAB è per Google Play." >> "$notes"
          cd .. && gh release create "$tag" $pre "rondine-${tag}.apk" "rondine-${tag}-play.apk" "rondine-${tag}-play.aab" \
            --target "$GITHUB_SHA" --title "Rondine ${tag}" --notes-file "$notes"
        shell: bash

      - name: Compila l'APK di prova
        if: github.ref_type != 'tag'
        working-directory: android
        run: ./gradlew --no-daemon assembleFossDebug

      - name: Pubblica l'APK di prova
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Su un tag si usa quello; su un branch se ne crea uno di prova sul commit compilato.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v0.1.0-prova.${GITHUB_RUN_NUMBER}"
          fi
          apk="rondine-${tag}.apk"
          cp android/app/build/outputs/apk/foss/debug/app-foss-debug.apk "$apk"
          gh release create "$tag" "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "Rondine ${tag} (prova)" \
            --notes "APK di prova (build debug) del commit ${GITHUB_SHA::7}, da installare a mano su Android 8 o successivo. Si installa accanto a un'eventuale versione definitiva (io.github.mtmattia.rondine.debug). Ogni APK di prova ha una firma diversa: per aggiornarlo va disinstallato il precedente, e con lui il profilo."
