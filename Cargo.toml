[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rondine-core = { path = "crates/rondine-core" }
rondine-mls = { path = "crates/rondine-mls" }
rondine-nodo = { path = "crates/rondine-nodo" }
rondine-client = { path = "crates/rondine-client" }

openmls = "0.9.1"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
openmls_memory_storage = "0.6.0"
tls_codec = "0.5.0"

ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Libreria per Android più piccola.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
