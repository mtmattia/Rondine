# APK di prova scaricabile: a ogni tag `v*`, e a ogni push sui branch di lavoro `ccr-*`, compila
# l'app (Rust con cargo-ndk + Gradle) e la allega a una Release di GitHub (pre-release). È la build debug, firmata con una chiave di debug generata
# qui: per una build firmata con la chiave del progetto servono i segreti del keystore.
name: APK

on:
  push:
    tags: ["v*"]
    branches: ["ccr-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: sdkmanager --install "ndk;29.0.14206865"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compila l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Pubblica nella Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Su un tag si usa quello; su un branch se ne crea uno di prova sul commit compilato.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v0.1.0-prova.${GITHUB_RUN_NUMBER}"
          fi
          apk="rondine-${tag}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$tag" "$apk" --prerelease --target "$GITHUB_SHA" \
            --title "Rondine ${tag} (prova)" \
            --notes "APK di prova (build debug) del commit ${GITHUB_SHA::7}, da installare a mano su Android 8 o successivo. Si installa accanto a un'eventuale versione definitiva (io.github.mtmattia.rondine.debug). Ogni APK di prova ha una firma diversa: per aggiornarlo va disinstallato il precedente, e con lui il profilo."
