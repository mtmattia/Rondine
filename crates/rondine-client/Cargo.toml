[package]
name = "rondine-client"
description = "Logica e stato del client Rondine, usati da CLI e app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rondine-core.workspace = true
rondine-mls.workspace = true
reqwest.workspace = true
axum.workspace = true
mdns-sd.workspace = true
if-addrs.workspace = true
rustls.workspace = true
quinn.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
blake3.workspace = true
rand.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
arti-client = { workspace = true, optional = true }
tor-rtcompat = { workspace = true, optional = true }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-rustls.workspace = true

[features]
# Il nido cieco passa da Tor (SPEC §14.6). Senza, le richieste anonime partono dirette.
default = ["tor"]
tor = ["dep:arti-client", "dep:tor-rtcompat"]

[dev-dependencies]
rondine-nodo.workspace = true
base64.workspace = true
tempfile.workspace = true

[lints]
workspace = true
