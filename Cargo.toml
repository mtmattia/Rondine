[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rondine-core = { path = "crates/rondine-core" }
rondine-mls = { path = "crates/rondine-mls" }
rondine-nodo = { path = "crates/rondine-nodo" }
rondine-client = { path = "crates/rondine-client" }
rondine-ritaglio = { path = "crates/rondine-ritaglio" }

openmls = "0.9.1"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
openmls_memory_storage = "0.6.0"
tls_codec = "0.5.0"

ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
# TLS: rustls con la crittografia di ring e i certificati del sistema operativo (niente
# elenco di CA dentro il binario, niente aws-lc).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# Scoperta dei dispositivi in rete locale (SPEC §12.1).
mdns-sd = "0.21"
# Indirizzi del dispositivo da annunciare con "sono collegato" (SPEC §12.3).
if-addrs = "0.15"
# Collegamento diretto con il buco nel NAT (SPEC §12.8): QUIC su rustls/ring e certificati
# autofirmati usa e getta.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# Deposito sigillato (SPEC §6.3): HPKE (RFC 9180) come in openmls, HKDF per la risposta.
hpke-rs = { version = "0.7", default-features = false }
hpke-rs-crypto = "0.7"
hpke-rs-rust-crypto = "0.7"
hkdf = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# Firma RS256 dei JWT per Google (ripetitore FCM, SPEC §8.1): è già la crittografia di rustls.
ring = "0.17"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Libreria per Android più piccola.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Il ritaglio degli sticker nei test: senza ottimizzazioni tract impiega decine di secondi.
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
