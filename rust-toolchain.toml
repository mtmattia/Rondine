# Versione di Rust fissata: la build dell'app deve essere riproducibile (stesso APK, byte per
# byte, compilato da noi, da GitHub Actions e da F-Droid), così tutti i canali hanno la stessa
# firma e le app si aggiornano a vicenda.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-linux-android", "x86_64-linux-android"]
