[package]
name = "rondine-ffi"
description = "Ponte UniFFI tra rondine-client e l'app Android (Kotlin)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "rondine_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
rondine-client.workspace = true
rondine-core.workspace = true
rondine-ritaglio.workspace = true
tokio.workspace = true
thiserror.workspace = true
uniffi = { version = "0.32", features = ["tokio", "cli"] }

[lints]
workspace = true

# Su Android il TLS si fida dell'archivio certificati di sistema, che si raggiunge dalla JVM:
# l'app passa il proprio Context una volta all'avvio (vedi `android_tls`).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier.workspace = true
