[versions]
agp = "9.3.3"
kotlin = "2.4.10"
composeBom = "2026.08.00"
iconsExtended = "1.7.8"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
navigation = "2.10.2"
coreKtx = "1.19.1"
coroutines = "1.11.0"
jna = "5.19.1"
unifiedpush = "3.3.5"
zxing = "3.5.4"
zxingEmbedded = "4.3.0"
webrtc = "149.0.0"
emojiPicker = "1.7.0"
# Solo nella versione Play (FCM, SPEC §8.1): non libera, mai nella versione foss.
firebaseMessaging = "26.0.0"
# Firebase porta una versione vecchia di fragment: serve almeno la 1.3 con le Activity Result API.
fragment = "1.9.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "iconsExtended" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
emoji-picker = { module = "androidx.emoji2:emoji2-emojipicker", version.ref = "emojiPicker" }
webrtc = { module = "im.conversations.webrtc:webrtc-android", version.ref = "webrtc" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
